<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Countdown Love</title>

<style>
  body {
    margin: 0;
    background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
  }

  h1 {
    margin-top: 20px;
    font-size: 2rem;
  }

  #countdown {
    font-size: 1.5rem;
    margin-bottom: 40px;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 60vh;
  }

  .person {
    position: absolute;
    bottom: 50px;
    font-size: 60px;
    transition: left 1s linear;
  }

  #person1 {
    left: 10%;
  }

  #person2 {
    left: 80%;
  }

  .heart {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 80px;
    opacity: 0;
    transition: opacity 1s ease;
  }

  .show-heart {
    opacity: 1;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.2); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }
</style>
</head>

<body>

<h1>Countdown to Us ❤️</h1>
<div id="countdown"></div>

<div class="scene">
  <div id="person1" class="person">🧍‍♂️</div>
  <div id="person2" class="person">🧍‍♀️</div>
  <div id="heart" class="heart">❤️</div>
</div>

<script>
  // 🔥 SET YOUR TARGET TIME HERE
  const endTime = new Date("2026-04-01T00:00:00").getTime();
  const startTime = new Date().getTime();

  const person1 = document.getElementById("person1");
  const person2 = document.getElementById("person2");
  const countdown = document.getElementById("countdown");
  const heart = document.getElementById("heart");

  function update() {
    const now = new Date().getTime();
    const totalDuration = endTime - startTime;
    const elapsed = now - startTime;

    let progress = elapsed / totalDuration;
    if (progress > 1) progress = 1;

    // Move people closer
    const left1 = 10 + (35 * progress);   // moves from 10% → 45%
    const left2 = 80 - (35 * progress);   // moves from 80% → 45%

    person1.style.left = left1 + "%";
    person2.style.left = left2 + "%";

    // Countdown text
    const remaining = endTime - now;

    if (remaining <= 0) {
      countdown.innerHTML = "Together Forever ❤️";
      heart.classList.add("show-heart");

      person1.innerHTML = "💑";
      person2.style.display = "none";
      return;
    }

    const hours = Math.floor(remaining / (1000 * 60 * 60));
    const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

    countdown.innerHTML = `${hours}h ${minutes}m ${seconds}s`;
  }

  setInterval(update, 1000);
</script>

</body>
</html>
